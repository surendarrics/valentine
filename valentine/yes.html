<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Yayyy ❤️</title>

  <style>
    body {
      background: linear-gradient(135deg,#ff9ecf,#ff6fa5);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Segoe UI';
      color: white;
      text-align: center;
      overflow: hidden;
    }

    h1 {
      font-size: 45px;
      margin-bottom: 20px;
      animation: pop 1s ease infinite alternate;
    }

    @keyframes pop {
      from { transform: scale(1); }
      to { transform: scale(1.15); }
    }

    img {
      width: 250px;
      border-radius: 20px;
    }
  </style>
</head>

<body>

<div>
  <h1>YAYYY 🥳💖</h1>
  <img src="https://media.giphy.com/media/111ebonMs90YLu/giphy.gif">
</div>

</body>
</html>
